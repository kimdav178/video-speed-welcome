<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sorry to see you go — Video Speed Controller</title>
    <meta name="description" content="Video Speed Controller was uninstalled. Tell us why in 30 seconds — it helps us improve." />
    <meta name="theme-color" content="#2563eb" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../assets/icon-128.png" />
    <link rel="stylesheet" href="../style.css" />
    <!-- Analytics: shared Umami site for kimdav178.github.io — filter reports by path /video-speed-welcome/uninstall/. Replace data-website-id before deploy. -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="f0e1c00b-eac9-42dd-a206-fee6c31581e7"></script>
    <!-- One anonymous "uninstall" count to our server: Chrome opens this page on removal.
         1.6.1+ add ?v=&s=<stage>&a=<age bucket> to the address; older versions send none.
         No install id. A reload within a day is not counted again (localStorage). -->
    <script src="uninstall.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../" aria-label="Video Speed Controller">
        <img src="../assets/icon-128.png" alt="" width="32" height="32" />
        <span>Video Speed Controller</span>
      </a>
    </header>

    <main>
      <section class="hero">
        <h1>Sorry to see you go</h1>
        <p class="lead">Video Speed Controller has been removed. If you have 30 seconds, tell us what didn&rsquo;t work — it genuinely helps us make it better.</p>
      </section>

      <section class="form-card">
        <!-- Short link: https://forms.gle/8wNCFzTz7mwTLHJF7 (embedded form id below). -->
        <iframe
          class="form-frame"
          src="https://docs.google.com/forms/d/e/1FAIpQLScj1k3mG9qhE3ExpKr5XRHzNGh1OnZgB4Rpsk7-heBtLGT9jw/viewform?embedded=true"
          title="Why did you uninstall Video Speed Controller?"
          loading="eager"
        >Loading…</iframe>
      </section>
    </main>

    <footer class="site-footer">
      Thanks for trying Video Speed Controller. You can reinstall anytime from the Chrome Web Store.
    </footer>
  </body>
</html>
